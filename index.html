<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Half · Fixion playtest prototype</title>
<style>
  :root {
    --ink: #000; --panel: rgba(10,14,20,.82); --rule: rgba(36,48,64,.9); --lab: #9aa8b6; --sub: #5a6878; --val: #e8eef6;
    --row: rgba(232,238,246,.78); --yellow: #FFD400; --red: #ff5c5c; --mint: #6fe2c7; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --ko: "Noto Sans Mono CJK KR", "Noto Sans CJK KR", "Apple SD Gothic Neo", "Noto Sans KR", "Noto Serif CJK SC", ui-monospace, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--val); font-family: var(--mono); font-size: 12px; overflow: hidden; overscroll-behavior: none; }
  body.ko .panel, body.ko .ticker, body.ko .booth, body.ko .row { font-family: var(--ko); }
  #stage { position: fixed; inset: 0; }
  #game { position: absolute; display: block; background: #10171f; touch-action: none; }
  .chrome { user-select: none; -webkit-user-select: none; }
  .lab { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--lab); }
  .sub { font-size: 9px; color: var(--sub); letter-spacing: .04em; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- the margin / sheet (one element, two homes) ---------- */
  .panel { position: absolute; background: var(--panel); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); display: flex; flex-direction: column; border-left: 1px solid var(--rule); }
  .panel.dim { opacity: .35; }
  .panel .hdr { height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  .panel .hdr .t { color: var(--lab); font-size: 11px; letter-spacing: .08em; font-weight: 700; }
  .panel .hdr .r { color: var(--val); font-size: 11px; }
  .panel .hdr .mic { color: var(--val); } .panel .hdr .mic.off { color: var(--sub); }
  .panel .hdr button { background: none; border: 1px solid transparent; color: var(--lab); font: inherit; font-size: 11px; padding: 6px 6px; min-height: 28px; }
  .panel .hdr button.on { color: var(--val); border-color: var(--rule); }
  .panel .list { flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; padding: 8px 0 6px; scrollbar-width: none; }
  .panel .list::-webkit-scrollbar { display: none; }
  .panel .ftr { height: 26px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 10px; border-top: 1px solid var(--rule); color: var(--sub); font-size: 9px; letter-spacing: .03em; white-space: nowrap; overflow: hidden; }
  .row { position: relative; flex-shrink: 0; display: grid; grid-template-columns: 20px 1fr 26px; align-items: start; min-height: 24px; padding: 3px 8px 3px 8px; color: var(--row); font-size: 12px; line-height: 18px; transition: opacity .3s; }
  .row:first-child { margin-top: auto; }
  .row.forming { opacity: .7; } .row.ghost { opacity: .32; } .row.residue { opacity: .35; } .row.dismissed .txt { text-decoration: line-through; opacity: .5; }
  .row .gut { color: var(--lab); text-align: center; } .row.k-broke .gut { color: var(--red); } .row.sel.k-broke .gut { color: var(--red); }
  .row .txt { white-space: pre; overflow: hidden; text-overflow: clip; }
  .row .st { color: var(--sub); text-align: right; font-size: 11px; white-space: nowrap; } .row .st .sup { vertical-align: super; font-size: 9px; }
  .row.sel::before { content: ''; position: absolute; left: 0; top: 2px; bottom: 2px; width: 3px; background: var(--yellow); }
  .row.sel .txt, .row.sel .gut { color: var(--yellow); }
  .row .hold { position: absolute; left: 8px; right: 10px; bottom: 0; height: 1px; background: var(--yellow); transform-origin: left; transform: scaleX(0); }
  .row.holding .hold { transition: transform .6s linear; transform: scaleX(1); }
  .row .strike { grid-column: 2; color: var(--sub); text-decoration: line-through; font-size: 12px; white-space: pre; overflow: hidden; }
  .row .ans, .row .got { grid-column: 2 / 4; color: var(--sub); font-size: 11px; white-space: pre-wrap; }
  .row .ans::before { content: '↳ '; }
  .row.st-live .gut { color: var(--mint); } .row.st-kept .st { color: var(--mint); } .row.st-reverted .st, .row.st-rolled .st { color: var(--red); }
  .row.merge-target { outline: 1px dashed var(--rule); }
  .list.merging .row:not(.merge-src):not(.residue) .gut { color: var(--val); }
  .open { grid-column: 1 / 4; padding: 6px 2px 8px 22px; display: grid; grid-template-columns: 56px 1fr; column-gap: 8px; row-gap: 3px; font-size: 11px; color: var(--val); border-top: 1px solid rgba(36,48,64,.5); margin-top: 4px; }
  .open .k { color: var(--lab); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding-top: 1px; }
  .open .v { white-space: pre-wrap; word-break: break-word; }
  .open .v.q { color: var(--row); } .open .v.q .conf { color: var(--sub); }
  .open .v .was { color: var(--sub); }
  .open .koma { grid-column: 1 / 3; display: flex; gap: 8px; align-items: flex-start; }
  .open .koma img { width: 132px; border: 2px solid #fff; outline: 1px solid #4a7ab8; outline-offset: -4px; image-rendering: pixelated; background: #10171f; box-shadow: 0 2px 6px rgba(0,0,0,.6); }
  .open .koma .cap { color: var(--sub); font-size: 10px; line-height: 14px; }
  .open .tier.nj { color: var(--yellow); } .open .tier.auto { color: var(--lab); }
  .open .hint { grid-column: 1 / 3; color: var(--sub); font-size: 10px; letter-spacing: .04em; padding-top: 4px; }
  .open .steps { color: var(--lab); }

  /* Pin: four corner brackets, the one body. Parked in the margin; leans (never crosses the black); folds flat during PTT. */
  #pin { position: fixed; width: 18px; height: 18px; pointer-events: auto; transition: left .09s linear, top .09s linear, opacity .2s, transform .25s; z-index: 30; }
  #pin i { position: absolute; width: 6px; height: 6px; border: 2px solid var(--yellow); }
  #pin i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; }
  #pin i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; }
  #pin i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; }
  #pin i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; }
  #pin.listening { animation: breathe 1.1s ease-in-out infinite; }
  #pin.hearing { transform: scale(.78); animation: none; }
  #pin.muted i { border-color: rgba(255,212,0,.35); border-style: dotted; } #pin.muted { animation: none; }
  #pin.folded i { display: none; } #pin.folded::after { content: '‖'; color: rgba(255,212,0,.6); position: absolute; left: 3px; top: -3px; font-size: 16px; font-weight: 700; }
  #pin.away { opacity: 0; }
  body.ipad #pin.lean { transform: translateX(-7px) scale(1.08); animation: none; }
  body.iphone #pin.lean { transform: translateY(-7px) scale(1.08); animation: none; }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }

  /* ---------- iPad: the rail ---------- */
  body.ipad .panel { top: 0; bottom: 0; right: 0; width: 300px; }
  body.ipad .ticker { display: none; }
  body.ipad .booth { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--rule); background: rgba(10,14,20,.4); }

  /* ---------- iPhone: the ticker and the sheet ---------- */
  body.iphone .panel { left: 0; right: 0; bottom: 0; height: 44%; border-left: 0; border-top: 1px solid var(--rule); transform: translateY(100%); transition: transform .18s ease-out; }
  body.iphone .panel.risen { transform: translateY(0); }
  .ticker { position: absolute; left: 0; right: 0; bottom: env(safe-area-inset-bottom); height: 44px; padding: 0 14px 0 34px; display: flex; align-items: center; gap: 10px; background: linear-gradient(to top, rgba(10,14,20,.92), rgba(10,14,20,.55)); color: rgba(232,238,246,.45); font-size: 11px; white-space: nowrap; overflow: hidden; }
  .ticker .gut { color: var(--lab); } .ticker .n { margin-left: auto; color: var(--sub); }
  body.iphone .booth { position: absolute; left: 0; right: 0; top: 0; padding-bottom: 0; gap: 4px; background: rgba(10,14,20,.94); border-bottom: 1px solid var(--rule); max-height: 46%; transform: translateY(calc(-100% + 24px)); transition: transform .18s ease-out; }
  body.iphone .note { display: none; }
  body.iphone .booth.open { transform: translateY(0); }
  body.iphone .booth .tab { display: block; }
  .booth .tab { display: none; order: 99; width: 100%; height: 24px; background: none; border: 0; color: var(--lab); font: inherit; font-size: 10px; letter-spacing: .08em; }

  /* ---------- the booth (prototype chrome: canned speech) ---------- */
  .booth { display: flex; flex-direction: column; padding: 10px 10px 8px; gap: 6px; overflow: hidden; }
  .booth .lab { padding: 2px 2px 4px; }
  .booth .chips { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; scrollbar-width: none; }
  .booth .chips::-webkit-scrollbar { display: none; }
  .booth button, .booth input { font: inherit; font-size: 11px; color: var(--val); background: transparent; border: 1px solid #2a3a4e; min-height: 36px; text-align: left; padding: 6px 8px; white-space: normal; line-height: 14px; }
  .booth button:active { background: #1a2430; }
  .booth button.cmd { color: var(--lab); text-transform: uppercase; letter-spacing: .06em; font-size: 10px; font-weight: 700; min-height: 32px; }
  .booth button.cmd.go { color: var(--mint); border-color: #2a4e46; }
  .booth .sayrow { display: flex; gap: 4px; } .booth .sayrow input { flex: 1; min-width: 0; } .booth .sayrow button { min-width: 44px; text-align: center; }
  .booth .bound { color: var(--yellow); font-size: 10px; min-height: 14px; }
  body.iphone .booth .chips { max-height: 30vh; }
  .note { position: fixed; left: 8px; bottom: calc(4px + env(safe-area-inset-bottom)); color: #3a4858; font-size: 9px; letter-spacing: .04em; pointer-events: none; z-index: 5; }
  body.iphone .note { left: auto; right: 8px; top: 28px; bottom: auto; }
  .listenmark { position: absolute; }
</style>
</head>
<body class="chrome">
<div id="stage">
  <canvas id="game"></canvas>

  <div id="booth" class="booth chrome">
    <button class="tab" id="boothTab">BOOTH ▾ · prototype: fake game, fake AI, canned speech</button>
    <div class="lab">Booth · canned speech <span class="sub">(prototype; the real tool hears you)</span></div>
    <div class="bound" id="bound"></div>
    <div class="chips" id="chips"></div>
    <div class="sayrow"><input id="say" placeholder="say…" autocomplete="off"><button id="sayBtn">▶</button></div>
    <button class="cmd go" id="demo">AUTO DEMO ▶</button>
    <button class="cmd" id="door">walk out the door →</button>
  </div>

  <div id="panel" class="panel chrome">
    <div class="hdr">
      <span class="t">HALF</span>
      <span class="r" id="hWorld">bar</span>
      <span class="r num" id="hTurn">t1</span>
      <span class="r num" id="hClock">00:00</span>
      <span class="mic" id="hMic">●</span>
      <button id="hLang">en</button>
      <button id="hQuiet" class="on" title="outline only on tap (the v1 default)">quiet</button>
    </div>
    <div class="list" id="list"></div>
    <div class="ftr"><span id="fCounts">0 items</span><span id="fState">listening</span></div>
  </div>

  <div id="ticker" class="ticker chrome"><span class="gut" id="tGut"></span><span id="tTxt">HALF · listening</span><span class="n num" id="tN"></span></div>
  <div id="pin" class="listening"><i></i><i></i><i></i><i></i></div>
  <div class="note">PROTOTYPE · fake game, fake AI, canned speech</div>
</div>

<script>// game-mock.js — a FAKE Fixion view for the playtest-voice prototype (also inlined into index.html; keep in sync).
// Mimics the ASCII skin (ink background, glyph map, shadowed actor glyphs with accent underlines, cream speech
// cards, feed under the deck). Everything here is fake data; nothing talks to the real sidecar.
//
// Exposes the surface the real in-game Playtest module would (DESIGN.md "Selection + outline API"):
//   GameMock.mount(canvas)                 draw loop at 720x1280 logical, scaled to the canvas size
//   GameMock.inventory()                   [{kind,id,label,rect}] every selectable thing right now
//   GameMock.rectFor(kind,id)              {x,y,w,h} in logical px (y down) or null
//   GameMock.outline(kind,id,opts)         opts: color, ttl(ms), alpha, mode 'glance'|'lock', dashed, label, question
//                                          outline(null) clears everything
//   GameMock.moment()                      compact JSON of "what is on screen" (what the listener gets)
//   GameMock.snapshot(rect)                dataURL of the current frame cropped to rect (logical px)
//   GameMock.busy()                        true while a speech card is still typing (a stage peak)
//   GameMock.ptt(down)                     simulate push-to-talk (green talk indicator, no transcript)
//   GameMock.chapter()                     the player walks out: chapter card over the map (a breath point)
//   GameMock.banner(title, body, by)       a Live-style update banner under the header
//   GameMock.setLang('en'|'ko')            bar (EN) or 광수의 집 (KO)
//   GameMock.hit(x,y)                      best selectable thing under a logical point
//   GameMock.on('op'|'ptt'|'chapter', fn)
(function () {
  const W = 720, H = 1280;
  const INK = '#10171f', PAPER = '#faf8ef', MINT = '#6fe2c7', MUTED = '#80919b', HEADER = '#0d131a',
        RULE = '#2b3a44', CARD_INK = '#1c232b', AMBER = '#f0c06f', TALK_GREEN = '#60ec8c',
        REASON_RED = '#ff5c5c', GOLD = '#ffd678';

  const MAP_EN = [
    '---------------', '|!!!.T.T.T.!!!|', '|.............|', '|.==========.b|', '|..h.h.h.h...t|',
    '|&...........b|', '|.............|', '"..h.......h..|', '|.ht.......th.|', '|..h.......h..|',
    '|.............|', '|A....,,,,...."', '|.....,,,,....|', '|.............|', '|#....&.&....J|', '-------+-------',
  ];
  const MAP_KO = [
    '----p--WW--p-C-', '|PBB.....AA...|', '|LBB..........|', '|.............M', '|m............|',
    '|.....rrrr....|', '|kc...rTTr....|', '|.....rrrr....|', '|b..........SS|', '|b..........t.|',
    '|............g|', '|F............|', '|K............|', '|K............|', '|.......e.....|', '-------D-------',
  ];
  const LEGEND_EN = {
    '-': ['-', '#4a5a66', 'wall', 'the wall'], '|': ['|', '#4a5a66', 'wall', 'the wall'],
    '"': ['"', '#8ab8d8', 'window', 'the window'], '+': ['+', '#e5c17e', 'door', 'the door'],
    '.': ['.', '#3a4149', 'floor', 'the floor'], ',': [',', '#6a5a4a', 'rug', 'the rug'],
    '#': ['#', '#7a8ea0', 'pad', "Potts's charging pad"], '!': ['!', null, 'bottles', 'the bottle shelf'],
    'T': ['T', '#d4a94f', 'taps', 'the beer taps'], '=': ['=', '#c8b078', 'counter', 'the bar counter'],
    'h': ['h', '#c0a67c', 'stool', 'a stool'], 'b': ['b', '#b08c68', 'bench', 'the booth'],
    't': ['t', '#b8a078', 'table', 'a table'], '&': ['&', '#6aaa78', 'plant', 'a potted plant'],
    'J': ['J', '#ff60b0', 'jukebox', 'the jukebox'], 'A': ['A', '#5adcff', 'arcade', 'the arcade cabinet'],
  };
  const LEGEND_KO = {
    '-': ['-', '#4a5a66', 'wall', '벽'], '|': ['|', '#4a5a66', 'wall', '벽'], '.': ['.', '#3a4149', 'floor', '바닥'],
    'p': ['□', '#d6be8c', 'photo', '사진'], 'W': ['"', '#8ab8d8', 'window', '창문'], 'C': ['o', '#dedacc', 'clock', '벽시계'],
    'P': ['o', '#e2e6f0', 'pillow', '베개'], 'B': ['=', '#b89c78', 'bed', '침대'], 'A': ['≡', '#b69c75', 'desk', '책상'],
    'L': ['i', '#ffde96', 'lamp', '스탠드'], 'M': ['‖', '#aac8e8', 'mirror', '거울'], 'm': ['!', '#ec9242', 'medicine', '약'],
    'r': [',', '#6a5a4a', 'rug', '러그'], 'T': ['t', '#b8a078', 'table', '탁자'], 'k': ['h', '#c0a67c', 'chair', '의자'],
    'c': ['h', '#c0a67c', 'chair', '의자'], 'b': ['b', '#b08c68', 'sofa', '소파'], 'S': ['▣', '#e8c478', 'shelf', '선반'],
    't': ['o', '#c0a67c', 'side_table', '협탁'], 'g': ['&', '#6aaa78', 'plant', '화분'], 'F': ['■', '#ccd2da', 'fridge', '냉장고'],
    'K': ['=', '#a09080', 'kitchen', '싱크대'], 'e': ['∪', '#d2d4dc', 'shoes', '신발'], 'D': ['+', '#e5c17e', 'door', '현관문'],
  };
  const BOTTLES = ['#e0a040', '#4caf7d', '#d0506a', '#8ac7da', '#8c6ec8'];

  const CAST_EN = {
    player: { glyph: '@', color: MINT, cell: [7, 11], tag: 'YOU' },
    Figgs:  { glyph: 'F', color: '#f0c06f', cell: [6, 2], tag: 'FIGGS' },
    Nuaz:   { glyph: 'N', color: '#ff8ac8', cell: [13, 4], tag: 'NUAZ', seated: true },
    Potts:  { glyph: 'P', color: '#9fc4e8', cell: [2, 13], tag: 'POTTS' },
    Buzz:   { glyph: '*', color: '#c8e0ff', cell: [12, 3], tag: 'BUZZ', flying: true },
    Yara:   { glyph: 'Y', color: '#c8a2ff', cell: [7, 15], tag: 'YARA', present: false },

  const CAST_KO = {
    player:   { glyph: '@', color: MINT, cell: [7, 11], tag: '나' },
    '송 박사': { glyph: '송', color: '#f0c06f', cell: [4, 2], tag: '송 박사' },
    '민수':   { glyph: '민', color: '#ff8ac8', cell: [11, 9], tag: '민수', seated: true },
    '히리야 상': { glyph: '히', color: '#9fc4e8', cell: [2, 8], tag: '히리야 상', seated: true },

  // A looping fake performance. kind: say | delta (an action line, shown in the feed with NO triangle glyph) |
  // walk | enter (walk in through the door) | shake (a big moment: screen shake + sound word).
  const SCRIPT_EN = [
    { kind: 'say', who: 'Figgs', text: "Evening. You look like you walked here from the wrong side of the overpass.", seq: 101 },
    { kind: 'delta', text: 'Nuaz glances up from her tablet, boots still on the table.', seq: 102 },
    { kind: 'say', who: 'Nuaz', text: "Figgs, he's dripping on your floor.", seq: 103 },

    { kind: 'delta', text: 'Figgs wipes a glass that was already clean.', seq: 110 },
    { kind: 'say', who: 'Figgs', text: "What'll it be?", seq: 111 },
    { kind: 'walk', who: 'Potts', to: [2, 13], text: 'Potts rolls back to its pad.', seq: 112 },
    { kind: 'walk', who: 'Yara', to: [9, 7], text: 'Yara takes the stool by the booth.', seq: 113 },
    { kind: 'say', who: 'Potts', text: 'Buzz, stop hovering over the man.', seq: 114 },
    { kind: 'delta', text: 'Buzz drifts back to the booth.', seq: 115 },
  ];
  const SCRIPT_KO = [
    { kind: 'say', who: '송 박사', text: '광수야. 정신이 좀 들어?', seq: 201 },
    { kind: 'delta', text: '민수가 소파에서 벌떡 일어난다.', seq: 202 },
    { kind: 'say', who: '민수', text: '야, 너 진짜 나 기억 안 나?', seq: 203 },
    { kind: 'walk', who: '히리야 상', to: [6, 10], text: '히리야 상이 조심스럽게 다가온다.', seq: 204 },
    { kind: 'say', who: '히리야 상', text: '광수 상... 괜찮습니까. 물, 마십니까?', seq: 205 },
    { kind: 'shake', who: '민수', word: '쾅!', text: '민수가 탁자를 내리친다.', seq: 206 },
    { kind: 'say', who: '민수', text: '야 너 진짜 기억 안 나냐고!', seq: 207 },
    { kind: 'delta', text: '송 박사가 손전등으로 광수의 눈을 비춘다.', seq: 208 },
    { kind: 'say', who: '송 박사', text: '동공은 정상이야. 일단 앉아.', seq: 209 },
    { kind: 'walk', who: '히리야 상', to: [2, 8], text: '히리야 상이 다시 의자로 돌아간다.', seq: 210 },
    { kind: 'say', who: '민수', text: '야, 너 진짜 나 기억 안 나?', seq: 211 },
  ];

  let lang = 'en';
  let MAP = MAP_EN, LEGEND = LEGEND_EN, cast = JSON.parse(JSON.stringify(CAST_EN)), SCRIPT = SCRIPT_EN;
  let canvas, ctx, raf = 0, frame = 0, t0 = performance.now();
  const listeners = { op: [], ptt: [], chapter: [] };
  let feed = [];              // [{text, kind, who, seq, t}]
  let card = null;            // {who, text, seq, shown, revealed, until}
